version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: second-brain-api
    # This now actually works — Dockerfile uses CMD, so this command
    # replaces it cleanly instead of getting appended to an ENTRYPOINT.
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - LOG_DIR=logs
      - LOG_LEVEL=INFO
      # PostgreSQL connection (PG_HOST etc.) and JWT_SECRET_KEY come from
      # .env via env_file above — no need to duplicate them here.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Streamlit UI (legacy stub — points users to the React frontend) ──────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: second-brain-streamlit
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  data:
  logs: