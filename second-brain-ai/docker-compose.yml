version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: second-brain-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - LOG_DIR=logs
      - LOG_LEVEL=INFO
      # Override PG_HOST just for this container. Inside Docker, "localhost"
      # means the container itself — it can't see PostgreSQL running natively
      # on your Windows/Mac host. host.docker.internal is Docker's special
      # DNS name that always resolves back to the host machine.
      #
      # Your .env keeps PG_HOST=localhost unchanged, which stays correct for
      # running `uvicorn` directly on Windows (outside Docker). This override
      # only applies when running via docker-compose.
      - PG_HOST=host.docker.internal
    # extra_hosts makes host.docker.internal resolve on Linux too — Docker
    # Desktop on Windows/Mac already supports it natively, this line is a
    # harmless no-op there and a required fix on Linux hosts.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Streamlit UI (legacy stub — points users to the React frontend) ──────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: second-brain-streamlit
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PG_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  data:
  logs: