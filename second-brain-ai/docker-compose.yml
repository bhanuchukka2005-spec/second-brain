version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: second-brain-ai
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data        # persist SQLite DB and uploads
      - ./logs:/app/logs        # persist logs
    env_file:
      - .env
    environment:
      - DB_PATH=data/sessions.db
      - LOG_DIR=logs
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  data:
  logs:
