name: CI — Test & Lint

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: second-brain-ai   # ← run all commands inside this folder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('second-brain-ai/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chromadb PyPDF2 python-pptx plotly pandas \
                      youtube-transcript-api python-dotenv \
                      fastapi uvicorn httpx python-multipart pydantic \
                      pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov=api \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: second-brain-ai/coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: second-brain-ai   # ← run all commands inside this folder

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pyflakes
        run: pip install pyflakes

      - name: Run pyflakes
        run: pyflakes src/ tests/ api/

      - name: Check syntax
        run: |
          find src/ tests/ api/ -name "*.py" -exec python -m py_compile {} \;
          python -m py_compile app.py
          echo "✅ All files syntax OK"